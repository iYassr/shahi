<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the app paint under the notch; the safe-area
      insets in styles.css keep content clear of it.

      interactive-widget=resizes-content makes the on-screen keyboard shrink the
      layout viewport instead of overlaying it, which is what stops the composer
      being buried. Not every browser implements it, so src/viewport.ts sizes
      from visualViewport as well and the two agree.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0E0D0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shahi" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <title>Shahi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%BASE_URL%welcome.js"></script>
  </body>
</html>
