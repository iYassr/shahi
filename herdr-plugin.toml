# Shahi as a herdr plugin: `herdr plugin install iYassr/shahi`.
#
# The sidecar is a long-running server and herdr's startup hooks are one-shot
# by contract, so the hook installs a user service (launchd or systemd) that
# supervises it, and every action here is a small command against that
# service. See docs/plugin.md. Every command goes through plugin/bun.sh, which
# finds bun wherever it is installed. During `herdr plugin install` only, if
# there is none, it runs bun's own installer (curl -fsSL https://bun.sh/install
# | bash) into ~/.bun — which, as that installer always does, also adds
# ~/.bun/bin to your shell's rc file, and needs curl, unzip and bash.

id = "shahi"
name = "Shahi"
version = "0.3.8"
min_herdr_version = "0.9.0"
description = "See and answer your terminal agents from your phone"
platforms = ["linux", "macos"]

# Run once on `herdr plugin install`, in this order, in the checkout.
#
# First, refuse a bun too old for Shahi, naming it and the fix, before
# anything is downloaded.
[[build]]
command = ["sh", "plugin/bun.sh", "run", "plugin/releases/requirements.ts"]

# The service, its manager and the web client it serves come prebuilt in a
# signed release (plugin/releases), so the checkout needs only what the
# plugin's own commands import: the runtime dependencies of `server` and
# `shared`. Installing every workspace (Expo, wrangler, Playwright; about a
# gigabyte) and building a web client nothing served made installs slow and
# fragile on small machines (pre-public-release review).
[[build]]
command = ["sh", "plugin/bun.sh", "install", "--frozen-lockfile", "--filter", "@shahi/server", "--filter", "@shahi/shared", "--production"]

# Wait for installation to commit before restarting an existing service.
[[build]]
command = ["sh", "plugin/bun.sh", "run", "plugin/update.ts"]

# Every herdr start: generate secrets the first time, (re)install the service
# so it supervises an approved immutable release, and exit.
[[startup]]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "setup"]

[[actions]]
id = "pair"
title = "Pair a phone"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "open-pair"]

[[actions]]
id = "status"
title = "Shahi status"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "status"]

[[actions]]
id = "restart"
title = "Restart Shahi"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "restart"]

[[actions]]
id = "stop"
title = "Stop Shahi"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "stop"]

[[actions]]
id = "logs"
title = "Shahi logs"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "logs"]

# Only the passcode's hash is kept, so a lost one is replaced: a new one is
# printed once to the plugin log (herdr plugin log list --plugin shahi) and the
# sidecar restarts with it. It is for a forgotten passcode, not a leaked one:
# paired phones and sessions already signed in stay as they are.
[[actions]]
id = "reset-passcode"
title = "Reset the Shahi passcode"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "reset-passcode"]

# The whole uninstall: stops the sidecar, removes its service (which herdr
# knows nothing about), then runs `herdr plugin uninstall shahi`. A plain
# `herdr plugin uninstall` or `disable` also ends it, once the service's
# manager next asks herdr (within about a minute). Your passcode, paired
# phones and transcripts stay in the config and state dirs. herdr has no
# hook for `plugin enable`, so after re-enabling, `shahi.restart` (or a
# herdr restart) brings the service back.
[[actions]]
id = "uninstall"
title = "Uninstall Shahi"
contexts = ["workspace"]
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "uninstall"]

# The QR, inside herdr. A popup closes when its command exits, so the command
# waits for Enter after printing — and after anything a setup or a failure
# printed, before the QR's screen or the exit can take it away.
[[panes]]
id = "pair"
title = "Pair a phone"
placement = "popup"
width = "95%"
height = "100%"
command = ["sh", "plugin/bun.sh", "run", "plugin/shahi.ts", "pair"]
