# A standalone UI-test project, on purpose.
#
# `mobile/ios/` is generated by `expo prebuild` and is not tracked, so a test
# target added inside it is wiped on the next prebuild. This project lives
# outside that, is checked in, and drives the *already-installed* app by its
# bundle id — `XCUIApplication(bundleIdentifier:)` — so it needs no host app
# and no share of the Expo project. Generate it with `xcodegen`, run it with
# `xcodebuild test`; see run.sh.
name: ShahiUITests
options:
  bundleIdPrefix: app.shahi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
targets:
  ShahiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShahiUITests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.shahi.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  ShahiUITests:
    build:
      targets:
        ShahiUITests: [test]
    test:
      targets:
        - ShahiUITests
