name: iOS end to end

# Dormant: run by hand only, and never proven here.
#
# The `maestro` job type requires a paid EAS plan. On the free tier this file
# validates server-side and refuses to run with:
#   "Running maestro_test jobs requires a paid plan."
# The build job below is free-tier eligible; only the test job is gated. It used
# to trigger on every push to master that touched mobile/ or .maestro/ while
# every flow signed in through a screen the app no longer has; the September
# 2026 review ported the flows to pairing and took the push trigger away until
# a run here has passed. The same flows run free against a local simulator —
# see docs/on-a-mac.md and docs/verify-on-device.md.
#
# This is for the things only a real iOS runtime can answer — the native tab
# bar, pairing by link, a picker that must show the right cautions.
on:
  workflow_dispatch: {}

jobs:
  build:
    name: Simulator build
    type: build
    params:
      platform: ios
      profile: e2e

  test:
    name: Maestro
    needs: [build]
    type: maestro
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: ../.maestro
      record_screen: true
      # A flake here costs a whole simulator boot, so one retry of only what
      # failed is cheaper than re-running the suite by hand.
      retries: 1
    hooks:
      before_maestro_tests:
        # The app pairs with the same recording fixture the local runs use:
        # e2e/hosted/server.ts, an encrypted relay and box in one process
        # whose writes end at the browser suite's stub. No live agents are
        # anywhere near a test. The simulator shares the host's network stack,
        # so a shahi://pair code naming 127.0.0.1:7572 reaches it, which is the
        # port every flow defaults to.
        - name: Install Bun
          run: curl -fsSL https://bun.sh/install | bash
        - name: Start the recording fixture
          run: |
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile
            HOSTED_PORT=7572 bun e2e/hosted/server.ts &
            # Wait for it rather than sleeping: a slow start would otherwise
            # look like a broken pairing screen.
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:7572/__hosted/ready >/dev/null && exit 0
              sleep 1
            done
            echo "the fixture never came up; every flow after this would fail for the wrong reason"
            exit 1
          working_directory: ..
