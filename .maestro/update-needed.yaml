# A computer this app cannot talk to says which side to update, in words.
#
# The app and the sidecar negotiate a contract version (`SHAHI_API_VERSION`),
# and a mismatch is meant to be a sentence naming the device to update — not
# an invalid-code error, and not a pairing that half-works. The fixture's stub
# is told to advertise a range the app does not speak, in each direction, and
# the phone pairs with it: the refusal must come from the handshake, before
# the code is spent, so the same code pairs once the versions agree.
#
# Then the other moment a person meets it: an app that was signed in when the
# computer moved on. A cold start has to land on "Update needed" with a way
# out. Over the relay the pane stream is not version-gated and its dashboard
# can arrive before the refused request; until September 2026 that dashboard
# wiped the notice into a live agent list, so the notice must also survive
# the pushes that follow it.
appId: app.shahi.mobile
name: A computer this app cannot talk to says which side to update
env:
  FIXTURE_PORT: ${FIXTURE_PORT || "7572"}
---
# The computer is ahead of the app: update the phone.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Connect your computer"
    timeout: 30000
- runScript:
    file: fixture/reset.js
    env:
      SCENARIO: "busy"
- runScript:
    file: fixture/set-meta.js
    env:
      MIN: "99"
      MAX: "99"
- openLink: ${output.pairingCode}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "confirm-pair"
    timeout: 15000
- tapOn:
    id: "confirm-pair"
- extendedWaitUntil:
    visible: ".*Update the app.*"
    timeout: 30000
- assertNotVisible: ".*pairing code is not valid.*"

# The computer is behind the app: update the computer.
- runScript:
    file: fixture/set-meta.js
    env:
      MIN: "0"
      MAX: "0"
- tapOn:
    id: "confirm-pair"
- extendedWaitUntil:
    visible: ".*Update Shahi on that computer.*"
    timeout: 30000
- assertNotVisible: ".*pairing code is not valid.*"

# Both refusals came from the handshake, so the code was never spent: once
# the computer speaks the app's version, the same code pairs.
- runScript: fixture/same-version.js
- tapOn:
    id: "confirm-pair"
- extendedWaitUntil:
    visible: "Agents"
    timeout: 30000

# The computer moves on while the app is closed: a genuine cold start, not
# Maestro's launchApp merely foregrounding an app that is still running.
- stopApp
- runScript:
    file: fixture/set-meta.js
    env:
      MIN: "99"
      MAX: "99"
- launchApp
- extendedWaitUntil:
    visible: "Update needed"
    timeout: 30000
- assertVisible: ".*Update the app.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Update needed"
- assertNotVisible:
    id: "row-w1:p1"

# "Switch server" is the way out: the list of computers, ready to add another.
- tapOn:
    id: "switch-server"
- extendedWaitUntil:
    visible:
      id: "add-computer"
    timeout: 15000
- runScript: fixture/same-version.js
