# Starting an agent, with the permission mode chosen up front.
#
# The mode picker is the thing most worth testing on a device: getting it wrong
# means an agent runs with flags nobody chose. The stub records what was asked
# for rather than starting anything, so this asserts the intent, and the
# workflow checks the recorded write afterwards.
appId: app.shahi.mobile
name: Start an agent with a permission mode
---
- launchApp:
    clearState: true
- tapOn:
    id: "server-address"
- inputText: "http://localhost:7272"
- tapOn:
    id: "passcode"
- inputText: "test"
- tapOn: "Connect"

- tapOn: "Spaces"
- tapOn: "project"
- tapOn: "+ New agent"

# Every claude mode should be offered, and the dangerous one should be
# reachable rather than hidden.
- assertVisible: "PERMISSIONS"
- assertVisible: "Ask me"
- assertVisible: "Plan first"
- tapOn: "Skip all permissions"
- assertVisible: "Never asks. It can run any command as you, without a prompt."
