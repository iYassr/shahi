# The reader must react the instant you send, not sit silent and then pop the
# reply in. The real "working" indicator comes from a poll, which lags the tap —
# and when the activity parse missed entirely, nothing showed at all until the
# answer landed, which read as the app hanging. The fix shows "Working"
# optimistically from the moment Send is tapped.
#
# The test sends to an idle/done pane ("Summarise the meeting") on purpose: that
# pane has no real activity, so a "Working" appearing after Send can only be the
# optimistic indicator — exactly the case that used to show nothing.
appId: app.shahi.mobile
name: The reader reacts instantly on send
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Connect your server"
    timeout: 15000
- tapOn:
    id: "intro-continue"
- tapOn:
    id: "server-address"
- inputText: "http://localhost:7272"
- tapOn:
    id: "passcode"
- inputText: "1234"
- tapOn: "Connect"
- assertVisible: "Agents"
- tapOn: ".*Summarise the meeting.*"
- tapOn: "Reply to this agent…"
- inputText: "does it react instantly"
- tapOn: "Send"
- assertVisible: "Working"
