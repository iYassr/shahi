# The filter chips: WhatsApp's grammar, this app's nouns — Waiting, each
# agent kind actually running, Shells. Two things worth pinning: a kind
# filter hides the other kinds' cards and rows alike, and All is the default
# that still shows everything the screen exists to show.
appId: app.shahi.mobile
name: Filter the agent list
env:
  FIXTURE_PORT: ${FIXTURE_PORT || "7572"}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Connect your computer"
    timeout: 30000
- runFlow: fixture/pair.yaml
- extendedWaitUntil:
    visible: ".*Which colour do you prefer.*"
    timeout: 15000

- tapOn: "Codex"
- assertNotVisible: ".*Convert PDF to markdown.*"
- assertNotVisible: ".*Which colour do you prefer.*"
- assertVisible: ".*Summarise the meeting.*"

# The chips scroll sideways, and Shells starts past the edge of the screen.
- swipe:
    from: "Waiting 1"
    direction: LEFT
- tapOn: "Shells"
- assertVisible:
    id: "row-w1:p3"
- assertNotVisible: ".*Summarise the meeting.*"

- swipe:
    from: "Shells"
    direction: RIGHT
- tapOn: "Waiting 1"
- assertVisible: ".*Which colour do you prefer.*"
- assertNotVisible: ".*Summarise the meeting.*"

- tapOn: "All"
- assertVisible: ".*Convert PDF to markdown.*"
- assertVisible: ".*Which colour do you prefer.*"
