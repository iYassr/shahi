# Pinning, through the long-press sheet — the in-app one: iOS 26's native
# ActionSheetIOS dropped synthesized taps on its buttons (glass transforms),
# so the sheet is the app's own and its buttons are plain Pressables. The
# assert is the row's own id carrying the pinned state, because a pressable
# flattens its children and a marker inside it is invisible to the driver.
# The swipe actions reach the same handlers and stay a finger-only
# convenience, hand-checked via docs/verify-on-device.md.
#
# Pins belong to the saved computer, and clearState/clearKeychain start this
# with none — which is also why no cleanup step is needed at the end.
appId: app.shahi.mobile
name: Pin a conversation and it stays pinned
env:
  FIXTURE_PORT: ${FIXTURE_PORT || "7572"}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Connect your computer"
    timeout: 30000
- runFlow: fixture/pair.yaml
- scrollUntilVisible:
    element:
      id: "row-w2:p1"
    direction: DOWN

- longPressOn:
    id: "row-w2:p1"
- tapOn: "Pin"
- assertVisible:
    id: "row-w2:p1-pinned"

# And it survives an app relaunch.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "row-w2:p1-pinned"
    timeout: 30000
