# The landing page and beta signup handler at getshahi.dev.
# build: bun run site/build.ts; ./dist includes the browser client at /pwa/.
#
# It lives beside the relay's config rather than in a separate repository so a
# claim on the page and the code that backs it move together — the page states
# what the product does, and this repo is where that becomes untrue first.
name = "shahi-site"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Anonymous usage metrics off, for the same reason as the relay's.
send_metrics = false
workers_dev = false
preview_urls = false

[assets]
binding = "ASSETS"
run_worker_first = ["/api/ios-beta", "/media/*"]
directory = "./dist"
not_found_handling = "404-page"

# The launch video, its poster and captions, served by src/media.ts. R2 rather
# than static assets, which cannot answer a byte range (Chrome then cannot seek);
# and rather than git, which every `herdr plugin install` clones.
# marketing/video/scripts/publish-media.ts fills it; site/media.json lists it.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shahi-site-media"

[[routes]]
pattern = "getshahi.dev"
custom_domain = true

[[send_email]]
name = "BETA_EMAIL"
allowed_sender_addresses = ["beta@getshahi.dev"]

[[ratelimits]]
name = "BETA_LIMIT"
namespace_id = "26090501"
simple = { limit = 5, period = 60 }

[[analytics_engine_datasets]]
binding = "SITE_TELEMETRY"
dataset = "shahi_site"

[observability]
enabled = true
redact_query_string = true
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
[observability.traces]
enabled = false
