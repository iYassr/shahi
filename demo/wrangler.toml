name = "shahi-review-demo"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]
send_metrics = false
workers_dev = false
preview_urls = false

[[routes]]
pattern = "review.getshahi.dev"
custom_domain = true

[vars]
DEMO_ORIGIN = "https://review.getshahi.dev"
RELAY_URL = "https://relay.getshahi.dev"
REVIEW_EXPIRES_AT = "2026-12-31T23:59:59Z"

[[containers]]
class_name = "ReviewContainer"
image = "registry.cloudflare.com/1d38f6aa36607ed18d2e5039b0608526/shahi-review-demo@sha256:8e8ffefc935ff1f0d2ca9973da6f258a1904d55e68ca8089aa231472d7097f8a"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "DEMO"
class_name = "ReviewContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReviewContainer"]

[[r2_buckets]]
binding = "STATE"
bucket_name = "shahi-review-demo-state"

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "3001"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false
