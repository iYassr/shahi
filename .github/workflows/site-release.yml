name: Prepare verified Shahi website release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shahi-site-release
  cancel-in-progress: false
jobs:
  website:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - name: Build the website and upload its matching browser source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN"
          bun run build:site
      - name: Record the immutable website artifact identity
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun .github/scripts/site-artifact.ts prepare site/dist site/release.json "$GITHUB_SHA"
      - name: Preserve the website with matching symbol uploads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-website
          path: |
            site/dist/
            site/release.json
          if-no-files-found: error
          retention-days: 7
      # The owner deploys these exact bytes with existing local Cloudflare
      # credentials from a clean checkout of this commit. No Cloudflare
      # credential is copied to GitHub, and this workflow publishes no site.
