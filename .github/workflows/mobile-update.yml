name: Signed Shahi phone update
on:
  workflow_dispatch:
    inputs:
      channel:
        description: App channel (matching installed binary)
        type: choice
        options: [beta, stable]
        default: beta
        required: true
      percentage:
        description: Initial rollout percentage
        type: choice
        options: ["10", "25", "50", "100"]
        default: "10"
        required: true
permissions:
  contents: read
concurrency:
  group: shahi-phone-update
  cancel-in-progress: false
jobs:
  tested:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/master'
    needs: tested
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # The step below holds the key every installed app trusts for updates.
      # Found in the pre-release review (September 2026): it ran `bunx
      # eas-cli@23.2.0`, which pinned only eas-cli itself and resolved its
      # ~480-package tree from npm by semver range on every publish, so a
      # compromised patch release anywhere in that tree would have run with
      # the key. The CLI now comes from .github/eas/bun.lock, frozen with
      # integrity hashes. It is installed in $RUNNER_TEMP because inside the
      # checkout Metro would crawl it (watchFolders is the repo root), and it
      # is kept out of the workspaces because there its older @expo/config
      # would be hoisted over SDK 57's and change what the app is built from.
      - name: Install the locked EAS CLI
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/eas"
          cp .github/eas/package.json .github/eas/bun.lock "$RUNNER_TEMP/eas/"
          cd "$RUNNER_TEMP/eas"
          bun install --frozen-lockfile
      # eas-cli still reads the key: it signs the manifest it publishes, and
      # the bundle it signs comes from the app's own locked toolchain anyway.
      # The key leaves the environment once it is on disk, so the build that
      # eas-cli spawns does not inherit it.
      - name: Sign and stage the compatible JavaScript update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHAHI_OTA_PRIVATE_KEY: ${{ secrets.SHAHI_OTA_PRIVATE_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          ROLLOUT_PERCENTAGE: ${{ inputs.percentage }}
        run: |
          set -eu
          umask 077
          test -n "$EXPO_TOKEN"
          test -n "$SHAHI_OTA_PRIVATE_KEY"
          printf '%s' "$SHAHI_OTA_PRIVATE_KEY" > "$RUNNER_TEMP/shahi-ota-key.pem"
          trap 'rm -f "$RUNNER_TEMP/shahi-ota-key.pem"' EXIT
          unset SHAHI_OTA_PRIVATE_KEY
          if [ "$RELEASE_CHANNEL" = stable ]; then EAS_ENVIRONMENT=production; else EAS_ENVIRONMENT=preview; fi
          "$RUNNER_TEMP/eas/node_modules/.bin/eas" update --environment "$EAS_ENVIRONMENT" --channel "$RELEASE_CHANNEL" --rollout-percentage "$ROLLOUT_PERCENTAGE" --private-key-path "$RUNNER_TEMP/shahi-ota-key.pem" --message "Shahi $GITHUB_SHA" --non-interactive
