name: Signed Shahi phone update
on:
  workflow_dispatch:
    inputs:
      channel:
        description: App channel (matching installed binary)
        type: choice
        options: [beta, stable]
        default: beta
        required: true
      percentage:
        description: Initial rollout percentage
        type: choice
        options: ["10", "25", "50", "100"]
        default: "10"
        required: true
permissions:
  contents: read
jobs:
  tested:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/master'
    needs: tested
    runs-on: ubuntu-latest
    environment: releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - name: Sign and stage the compatible JavaScript update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHAHI_OTA_PRIVATE_KEY: ${{ secrets.SHAHI_OTA_PRIVATE_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          ROLLOUT_PERCENTAGE: ${{ inputs.percentage }}
        run: |
          set -eu
          umask 077
          test -n "$EXPO_TOKEN"
          test -n "$SHAHI_OTA_PRIVATE_KEY"
          printf '%s' "$SHAHI_OTA_PRIVATE_KEY" > "$RUNNER_TEMP/shahi-ota-key.pem"
          trap 'rm -f "$RUNNER_TEMP/shahi-ota-key.pem"' EXIT
          if [ "$RELEASE_CHANNEL" = stable ]; then EAS_ENVIRONMENT=production; else EAS_ENVIRONMENT=preview; fi
          bunx eas-cli@23.2.0 update --environment "$EAS_ENVIRONMENT" --channel "$RELEASE_CHANNEL" --rollout-percentage "$ROLLOUT_PERCENTAGE" --private-key-path "$RUNNER_TEMP/shahi-ota-key.pem" --message "Shahi $GITHUB_SHA" --non-interactive
