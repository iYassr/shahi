# The suite used to run when someone remembered, which meant it ran after a
# regression rather than before one. Everything here is a command that already
# existed; the only new thing is that it happens on its own.
#
# Three jobs on purpose: `checks` answers in under a minute and catches most
# mistakes, `browser` takes a few minutes because it builds the client and
# drives two engines, and `herdr` is the only one that talks to the real thing.
# Failing fast on the cheap one is worth the duplicated install.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      # This also covers the parked Expo app, which is the only automatic check
      # that it still compiles against `shared/`. Two clients drifting apart is
      # otherwise invisible until someone tries to build the one nobody runs.
      - run: bun run typecheck

      - run: bun test shared/src server web/src plugin

      # The relay's own suite starts a local `wrangler dev` — no account, no
      # network beyond the loopback — and proves the Worker end of the protocol.
      - run: bun run test:relay

      # The native app runs on a different runner: jest-expo renders real
      # components in a JS environment, which is the only automated coverage
      # `mobile/` has and the only kind that needs no simulator.
      - run: bun run test:mobile

  browser:
    name: playwright, both engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      # The stub serves web/dist, so an unbuilt client means the suite tests
      # yesterday's app — the same trap as forgetting to rebuild before a
      # restart, and just as quiet.
      - run: bun run build:web

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # WebKit is not optional. Three faults in a row were invisible in
      # Chromium: a tap that never landed, a thumbnail that collapsed, and a
      # blank page in a Safari tab.
      - run: bunx playwright install --with-deps chromium webkit

      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The stub cannot notice the day herdr answers differently; this can. It runs
  # the adapter and the sidecar against a real headless herdr — the oldest
  # release still supported, and whatever `install.sh` hands out today, so the
  # next stable release is tried here before anyone installs it. The preview
  # channel runs nightly in herdr-preview.yml.
  herdr:
    name: real herdr (${{ matrix.herdr }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The first is the minimum supported version — pinned by tag, so the
        # job means the same thing next month. The second floats.
        herdr: [v0.8.2, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      - name: Install herdr ${{ matrix.herdr }}
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ "${{ matrix.herdr }}" = "stable" ]; then
            curl -fsSL https://herdr.dev/install.sh | sh
          else
            curl -fsSL -o "$HOME/.local/bin/herdr" \
              "https://github.com/herdrdev/herdr/releases/download/${{ matrix.herdr }}/herdr-linux-x86_64"
            chmod +x "$HOME/.local/bin/herdr"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version

      # `herdr server` runs in the foreground by design ("for supervised or
      # service-style setups"), so it is backgrounded here and polled for its
      # socket. A named session, for the same reason as on a developer's Mac:
      # a bare socket override restores the default session's saved state and
      # re-launches its agents, and one recipe everywhere is one to get wrong.
      - name: Start a headless herdr
        run: |
          nohup herdr --session shahi-ci server > /tmp/herdr-server.log 2>&1 &
          export HERDR_SOCKET_PATH="$HOME/.config/herdr/sessions/shahi-ci/herdr.sock"
          for i in $(seq 1 60); do [ -S "$HERDR_SOCKET_PATH" ] && break; sleep 0.5; done
          echo "HERDR_SOCKET_PATH=$HERDR_SOCKET_PATH" >> "$GITHUB_ENV"
          herdr session list

      - run: SHAHI_HERDR_LIVE=1 bun test server/lib/herdr-live.test.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: herdr-server-log-${{ matrix.herdr }}
          path: /tmp/herdr-server.log
          if-no-files-found: ignore
          retention-days: 7
