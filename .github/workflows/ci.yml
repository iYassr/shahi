name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Release approval calls this workflow too. A normal push must not cancel or
  # hold up that release's mandatory checks through a shared concurrency key.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrades:
    name: upgrade and recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun test plugin/releases server/lib/backend.test.ts server/lib/http.test.ts
      - run: bun run build:web
      - run: bun plugin/releases/build.ts
      - run: bun plugin/releases/compatibility-smoke.ts
      - run: bun plugin/releases/manager-smoke.ts
      - name: Preserve the tested release candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-computer-package
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  checks:
    name: types and unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      # This also covers the native Expo app, which is a check
      # that it compiles against `shared/`. Two clients drifting apart is
      # otherwise invisible until someone tries to build the one nobody runs.
      - run: bun run typecheck

      - run: bun run test

      # The relay's own suite starts a local `wrangler dev` — no account, no
      # network beyond the loopback — and proves the Worker end of the protocol.
      - run: bun run test:relay

      # Component tests in JavaScript; this does not compile or run an iOS binary.
      - run: bun run test:mobile

  browser:
    name: browser (${{ matrix.suite }}, Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, hosted, pwa]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      # The stub serves web/dist, so an unbuilt client means the suite tests
      # yesterday's app — the same trap as forgetting to rebuild before a
      # restart, and just as quiet.
      - run: bun run build:web

      - name: Cache browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # WebKit is not optional. Three faults in a row were invisible in
      # Chromium: a tap that never landed, a thumbnail that collapsed, and a
      # blank page in a Safari tab.
      - run: bunx playwright install --with-deps chromium webkit

      - run: bun run build:site
        if: matrix.suite != 'e2e'
      - run: bun run test:${{ matrix.suite }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            test-results/
            e2e/test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The stub cannot notice the day herdr answers differently; this can. It runs
  # the adapter and the sidecar against a real headless herdr — the oldest
  # release still supported, and whatever herdr's own installer hands out, so the
  # next stable release is tried here before anyone installs it. The preview
  # channel runs nightly in herdr-preview.yml.
  herdr:
    name: real herdr (${{ matrix.herdr }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The first is the minimum supported version — pinned by tag, so the
        # job means the same thing next month. Stable follows upstream releases.
        herdr: [v0.9.0, v0.9.1, stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      - name: Install herdr ${{ matrix.herdr }}
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ "${{ matrix.herdr }}" = "stable" ]; then
            curl -fsSL https://herdr.dev/install.sh | sh
          else
            curl -fsSL -o "$HOME/.local/bin/herdr" \
              "https://github.com/herdrdev/herdr/releases/download/${{ matrix.herdr }}/herdr-linux-x86_64"
            chmod +x "$HOME/.local/bin/herdr"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version

      # `herdr server` runs in the foreground by design ("for supervised or
      # service-style setups"), so it is backgrounded here and polled for its
      # socket. A named session, for the same reason as on a developer's Mac:
      # a bare socket override restores the default session's saved state and
      # re-launches its agents, and one recipe everywhere is one to get wrong.
      - name: Start a headless herdr
        run: bash .github/scripts/start-herdr.sh

      - run: SHAHI_HERDR_LIVE=1 bun test server/lib/herdr-live.test.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: herdr-server-log-${{ matrix.herdr }}
          path: /tmp/herdr-server.log
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [checks, upgrades, browser, herdr]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
