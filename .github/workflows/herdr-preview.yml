# Tomorrow's herdr, tonight.
#
# herdr publishes a prerelease most days. Running Shahi's live suite against
# the newest one turns "the next release broke us" into an issue filed the
# night the change landed, with a week or more to react before it is stable.
# It never blocks a push: a preview failure opens or updates an issue and
# nothing else.
name: herdr nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# The job that runs the preview has a read-only token and leaves nothing on
# disk. Only the job that files the issue can write, and it runs no herdr.
# Found in the pre-release review (September 2026): one job used to do both,
# with its token persisted in .git/config next to an unchecked binary.
permissions:
  contents: read

concurrency:
  group: herdr-preview
  cancel-in-progress: true

jobs:
  # Two herdrs a night: the newest prerelease, a week or more ahead of users,
  # and what herdr's installer hands out today. Stable was tested only when a
  # Shahi release ran CI, so herdr 0.9.4 and 0.9.5 reached every computer
  # untested (October 2026); with the service's own gate in the suite, a
  # stable herdr Shahi cannot use now files an issue the night it ships.
  preview:
    name: real herdr (latest ${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        channel: [preview, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile

      # A prerelease has no digest to pin it against. This proves only that
      # the bytes are the ones GitHub's immutable release records. Stable
      # comes from herdr.dev's manifest, cross-checked against GitHub, as in
      # ci.yml.
      - name: Install the newest ${{ matrix.channel }}
        id: herdr
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            manifest=$(curl -fsSL --retry 3 https://herdr.dev/latest.json)
            tag="v$(jq -er '.version' <<< "$manifest")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            bash .github/scripts/install-herdr.sh "$tag" "$(jq -er '.sha256["linux-x86_64"]' <<< "$manifest")"
          else
            tag=$(gh api --paginate --slurp "repos/herdrdev/herdr/releases?per_page=100" | jq -er 'add | map(select(.prerelease and (.draft | not))) | sort_by(.published_at) | last | .tag_name')
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            bash .github/scripts/install-herdr.sh "$tag"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start a headless herdr
        run: |
          herdr --version
          bash .github/scripts/start-herdr.sh

      # The adapter, the routes, and the service's own gate, which must say
      # "connected": a herdr Shahi cannot use fails here, preview or stable.
      - name: Run the live suite
        id: probe
        run: SHAHI_HERDR_LIVE=1 SHAHI_HERDR_PREVIEW=1 bun test server/lib/herdr-live.test.ts

      - name: Explain coverage
        if: always()
        env:
          TAG: ${{ steps.herdr.outputs.tag }}
          RESULT: ${{ steps.probe.outcome }}
        run: |
          printf 'herdr %s: live suite %s.\n' "$TAG" "$RESULT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: herdr-${{ matrix.channel }}-server-log
          path: /tmp/herdr-server.log
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: file the nightly failure
    needs: preview
    if: ${{ !cancelled() && needs.preview.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Tonight's herdr breaks the live suite"
          existing=$(gh issue list --state open --search "in:title \"breaks the live suite\"" --json number --jq '.[0].number')
          body="The nightly run against herdr's newest prerelease or stable release failed; the run's summary names the version: $RUN"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label herdr
          fi
