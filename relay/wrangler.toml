# The blind relay: one Worker, one Durable Object per box. `docs/relay.md` is
# the protocol; "Operating the relay" at the end of it is how to deploy this.
name = "shahi-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Anonymous usage metrics off: this is somebody's private relay, and the
# default is to phone home from every `wrangler` invocation.
send_metrics = false

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayBox"

# SQLite-backed rather than the older key-value flavour: it is the only kind
# the free plan allows, and the relay stores nothing anyway — every byte of
# state lives on the WebSocket attachments, which hibernate with the socket.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayBox"]

# A per-IP connection limiter at the front door (pentest C1): an over-quota
# source is refused before a Durable Object is addressed, so a stranger cannot
# open sockets to arbitrary serverIds and burn the account's daily quota. This
# bounds one source; the account-wide ceiling is a paid plan plus a WAF rule on
# /v1/* — see docs/relay.md, "Operating the relay". The binding is read
# optionally in src/index.ts, so `wrangler dev` and the test harness (which set
# no binding) are unaffected.
# Telemetry: one Analytics Engine data point per relay event (box auth, phone
# open/close with its code, refusals). Free to write, stores no row to prune,
# and the relay stays blind — only the serverId (a hash) and coarse signals are
# recorded, never a path or a byte. Queried with SQL for active-session counts,
# close-code and refusal breakdowns; see docs/relay.md "Observability". The GET
# /stats endpoint is off unless STATS_TOKEN (and, to read, CF_ACCOUNT_ID +
# CF_ANALYTICS_TOKEN with Account Analytics Read) are set as secrets.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "shahi_relay"

[[unsafe.bindings]]
name = "CONNECT_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 10 }
